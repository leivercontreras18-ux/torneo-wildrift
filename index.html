<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arena Wild Rift | Inicio</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --cyan: #00e5ff;
            --magenta: #ff007f;
        }

        body {
            margin: 0; padding: 0; height: 100vh;
            font-family: 'Rajdhani', sans-serif;
            /* Usamos tu imagen como fondo que cubre toda la pantalla */
            background-image: url('logo.jpg');
            background-size: cover;
            background-position: center top; /* Centrado arriba para ver el logo */
            background-repeat: no-repeat;
            background-color: #050505;
            display: flex; flex-direction: column;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        /* Capa oscura degradada en la parte inferior para tapar los botones falsos de la foto */
        .overlay {
            position: absolute;
            bottom: 0; left: 0; width: 100%; height: 40vh;
            background: linear-gradient(to top, #050505 20%, transparent 100%);
            z-index: 1;
        }

        /* Contenedor de nuestros botones REALES */
        .btn-container {
            position: absolute;
            top: 62%; /* Posicionados justo donde estaban los de la foto */
            display: flex; flex-direction: column; gap: 15px; width: 100%; max-width: 300px;
            z-index: 10;
        }

        .btn {
            padding: 12px 20px;
            font-size: 1.1rem;
            font-weight: 700;
            text-transform: uppercase;
            text-decoration: none;
            border-radius: 5px;
            transition: 0.3s;
            letter-spacing: 1px;
            font-family: 'Rajdhani', sans-serif;
            text-align: center;
            cursor: pointer;
        }

        .btn-primary {
            background: linear-gradient(90deg, var(--cyan), #0099ff);
            color: #000;
            border: 2px solid var(--cyan);
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.4);
        }
        .btn-primary:hover {
            box-shadow: 0 0 25px rgba(0, 229, 255, 0.8);
            transform: scale(1.05);
        }

        .btn-secondary {
            background: #111;
            color: #fff;
            border: 2px solid #555;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
        }
        .btn-secondary:hover {
            border-color: #aaa;
            background: #1a1a1a;
            transform: scale(1.05);
        }

        /* Footer Legal */
        .footer {
            position: absolute;
            bottom: 15px;
            font-size: 0.8rem;
            color: #555;
            z-index: 10;
        }
        .footer a {
            color: #555; text-decoration: none; margin: 0 10px;
        }
        .footer a:hover { color: var(--magenta); }

        /* Ajuste para celulares */
        @media (max-width: 768px) {
            body {
                background-size: 150% auto; /* Hacemos zoom en celular para que se vea bien */
                background-position: center top;
            }
            .btn-container { top: 60%; }
        }
    </style>
</head>
<body>

    <!-- Capa para fundir la parte de abajo de la foto con el fondo oscuro -->
    <div class="overlay"></div>

    <!-- Nuestros botones reales sobre la imagen -->
    <div class="btn-container">
        <a href="torneo.html" class="btn btn-primary">Entrar al Torneo</a>
        <a href="admin.html" class="btn btn-secondary">Acceso Organizador</a>
    </div>

    <div class="footer">
        <a href="#">Términos y Condiciones</a> | 
        <a href="#">Política de Privacidad</a>
    </div>

</body>
</html>
