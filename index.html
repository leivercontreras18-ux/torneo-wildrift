<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arena Wild Rift | Inicio</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505;
            --cyan: #00e5ff;
            --magenta: #ff007f;
            --text-main: #c9d1d9;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Rajdhani', sans-serif;
            margin: 0; padding: 0; height: 100vh;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            /* Fondo con textura de hexágonos sutil simulada con gradientes */
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(26, 26, 46, 0.8) 0%, #050505 80%),
                repeating-linear-gradient(30deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, transparent 1px, transparent 40px),
                repeating-linear-gradient(-30deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, transparent 1px, transparent 40px);
            background-size: cover;
            text-align: center;
            overflow: hidden;
        }

        /* El Logo Mágico */
        .logo-container {
            margin-bottom: 40px;
            animation: flotar 4s ease-in-out infinite;
        }
        .logo-img {
            max-width: 350px;
            width: 90%;
            /* Este truco hace que el fondo negro del JPG desaparezca */
            mix-blend-mode: screen; 
            filter: drop-shadow(0 0 20px rgba(0, 229, 255, 0.3));
        }

        /* Animación de flotar */
        @keyframes flotar {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        /* Botones */
        .btn-container {
            display: flex; flex-direction: column; gap: 20px; width: 100%; max-width: 350px;
        }

        .btn {
            padding: 15px 20px;
            font-size: 1.2rem;
            font-weight: 700;
            text-transform: uppercase;
            text-decoration: none;
            border-radius: 5px;
            transition: 0.3s;
            letter-spacing: 1px;
            font-family: 'Rajdhani', sans-serif;
            position: relative;
        }

        .btn-primary {
            background: linear-gradient(90deg, var(--cyan), #0099ff);
            color: #000;
            border: 2px solid var(--cyan);
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.4);
        }
        .btn-primary:hover {
            box-shadow: 0 0 25px rgba(0, 229, 255, 0.8);
            transform: scale(1.02);
        }

        .btn-secondary {
            background: #111;
            color: #fff;
            border: 2px solid #555;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
        }
        .btn-secondary:hover {
            border-color: #aaa;
            background: #1a1a1a;
            transform: scale(1.02);
        }

        /* Footer */
        .footer {
            position: absolute;
            bottom: 20px;
            font-size: 0.8rem;
            color: #555;
        }
        .footer a {
            color: #555; text-decoration: none; margin: 0 10px;
        }
        .footer a:hover { color: var(--magenta); }

    </style>
</head>
<body>

    <div class="logo-container">
        <img src="logo.jpg" alt="Arena Wild Rift" class="logo-img">
    </div>

    <div class="btn-container">
        <a href="torneo.html" class="btn btn-primary">Entrar al Torneo</a>
        <a href="admin.html" class="btn btn-secondary">Acceso Organizador</a>
    </div>

    <div class="footer">
        <a href="#">Términos y Condiciones</a> | 
        <a href="#">Política de Privacidad</a>
    </div>

</body>
</html>
