<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Torneo Wild Rift | Arena Online</title>
    <style>
        /* Estilos básicos con estética oscura */
        body {
            background-color: #0a0a0a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }
        .hero {
            text-align: center;
            padding: 60px 20px;
            background: linear-gradient(180deg, #1a1a2e 0%, #0a0a0a 100%);
            border-bottom: 2px solid #00d2ff;
        }
        .hero h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #00d2ff;
        }
        .info-torneo {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 20px 0;
            font-size: 1.2rem;
        }
        .premio {
            font-size: 2rem;
            color: #ffd700;
            font-weight: bold;
            margin: 20px 0;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }
        .btn-inscripcion {
            background-color: #00d2ff;
            color: #000;
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
        }
        .btn-inscripcion:hover {
            background-color: #fff;
            box-shadow: 0 0 15px #00d2ff;
        }
    </style>
</head>
<body>

    <header class="hero">
        <h1>Arena Wild Rift #1</h1>
        <div class="info-torneo">
            <span>📅 15 de Noviembre</span>
            <span>⚔️ 5v5 - Eliminación Directa</span>
            <span>🖥️ 100% Online</span>
        </div>
        <div class="premio">💰 Pozo: $100 USD</div>
        <button class="btn-inscripcion">Inscribir mi Equipo</button>
    </header>

</body>
</html>
