<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración | Arena Wild Rift</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #0d1117; --panel-bg: #161b22; --text-main: #c9d1d9;
            --cyan: #00e5ff; --magenta: #ff007f; --green: #00e676; --yellow: #ffab00;
        }
        body {
            background-color: var(--bg-color); color: var(--text-main);
            font-family: 'Rajdhani', sans-serif; margin: 0; padding: 0;
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }
        
        /* LOGIN */
        .login-container {
            background-color: var(--panel-bg); padding: 40px; border-radius: 10px;
            border: 1px solid var(--cyan); box-shadow: 0 0 20px rgba(0,229,255,0.2);
            width: 100%; max-width: 400px; text-align: center;
        }
        .login-container h1 { color: var(--cyan); margin-top: 0; }
        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group label { display: block; margin-bottom: 5px; font-weight: 700; }
        .input-group input {
            width: 100%; padding: 12px; border-radius: 5px; border: 1px solid #30363d;
            background-color: #0d1117; color: #fff; box-sizing: border-box;
        }
        .btn {
            background: linear-gradient(90deg, var(--cyan), var(--magenta));
            color: #fff; padding: 12px; width: 100%; font-size: 1.1rem; font-weight: 700;
            border: none; border-radius: 5px; cursor: pointer; transition: 0.3s;
        }
        .btn:hover { transform: scale(1.02); }

        /* DASHBOARD */
        #dashboard { display: none; width: 100%; max-width: 1000px; padding: 20px; }
        .header-panel {
            display: flex; justify-content: space-between; align-items: center;
            background-color: var(--panel-bg); padding: 20px; border-radius: 10px;
            border: 1px solid #30363d; margin-bottom: 20px;
        }
        .header-panel h1 { margin: 0; color: var(--cyan); }
        .btn-logout { background: #da3633; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        
        .table-container { background-color: var(--panel-bg); padding: 20px; border-radius: 10px; border: 1px solid #30363d; overflow-x: auto;}
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 12px; border-bottom: 1px solid #30363d; }
        th { color: var(--cyan); }
        .status-pending { color: var(--yellow); font-weight: bold; }
        
        .btn-approve {
            background-color: var(--green); color: #000; padding: 8px 15px;
            border: none; border-radius: 5px; cursor: pointer; font-weight: 700;
        }
        .btn-approve:hover { background-color: #00c853; }
        .empty-msg { text-align: center; color: #8b949e; padding: 20px; }
    </style>
</head>
<body>

    <!-- LOGIN -->
    <div id="login-section" class="login-container">
        <h1>Acceso Organizador</h1>
        <form id="login-form">
            <div class="input-group">
                <label>Correo Electrónico</label>
                <input type="email" id="email" required placeholder="tu@correo.com">
            </div>
            <div class="input-group">
                <label>Contraseña</label>
                <input type="password" id="password" required placeholder="********">
            </div>
            <button type="submit" class="btn" id="btn-login">Iniciar Sesión</button>
        </form>
    </div>

    <!-- PANEL -->
    <div id="dashboard">
        <div class="header-panel">
            <h1>Panel de Control - Torneo</h1>
            <button class="btn-logout" id="btn-logout">Cerrar Sesión</button>
        </div>

        <div class="table-container">
            <h2>Equipos Pendientes de Aprobación</h2>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Equipo</th>
                        <th>Capitán</th>
                        <th>Contacto</th>
                        <th>Comprobante</th>
                        <th>Estado</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="tabla-equipos"></tbody>
            </table>
            <div id="mensaje-vacio" class="empty-msg" style="display:none;">No hay equipos pendientes por ahora.</div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://evlogrwanimynsodcdzu.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_ltDzkQz__8Nt1b68BSs-Sw_2ylQACi1';
        const { createClient } = supabase;
        const db = createClient(SUPABASE_URL, SUPABASE_KEY);

        const loginSection = document.getElementById('login-section');
        const dashboard = document.getElementById('dashboard');
        const loginForm = document.getElementById('login-form');
        const btnLogout = document.getElementById('btn-logout');
        const tablaEquipos = document.getElementById('tabla-equipos');
        const mensajeVacio = document.getElementById('mensaje-vacio');

        async function checkSession() {
            const { data: { session } } = await db.auth.getSession();
            if (session) mostrarDashboard();
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-login');
            btn.textContent = 'Verificando...';

            const { error } = await db.auth.signInWithPassword({
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            });

            if (error) {
                alert('Error: ' + error.message);
                btn.textContent = 'Iniciar Sesión';
            } else {
                mostrarDashboard();
                btn.textContent = 'Iniciar Sesión';
            }
        });

        btnLogout.addEventListener('click', async () => {
            await db.auth.signOut();
            location.reload();
        });

        async function mostrarDashboard() {
            loginSection.style.display = 'none';
            dashboard.style.display = 'block';
            cargarEquiposPendientes();
        }

        async function cargarEquiposPendientes() {
            const { data, error } = await db.from('teams').select('*').eq('status', 'Pendiente');

            if (error) { console.error(error); return; }
            tablaEquipos.innerHTML = '';

            if (data.length === 0) {
                mensajeVacio.style.display = 'block';
                return;
            }
            mensajeVacio.style.display = 'none';

            data.forEach(equipo => {
                const fila = document.createElement('tr');
                fila.innerHTML = `
                    <td>${equipo.id}</td>
                    <td style="font-weight:bold; color:white;">${equipo.team_name}</td>
                    <td>${equipo.captain_name}</td>
                    <td>${equipo.contact_info}</td>
                    <td><a href="${equipo.payment_proof}" target="_blank" style="color:var(--cyan);">Ver Comprobante</a></td>
                    <td class="status-pending">${equipo.status}</td>
                    <td><button class="btn-approve" onclick="aprobarEquipo(${equipo.id})">Aprobar</button></td>
                `;
                tablaEquipos.appendChild(fila);
            });
        }

        window.aprobarEquipo = async function(id) {
            if (!confirm('¿Aprobar este equipo? Aparecerá en la web pública.')) return;
            const { error } = await db.from('teams').update({ status: 'Confirmado' }).eq('id', id);
            if (error) alert('Error al aprobar: ' + error.message);
            else cargarEquiposPendientes();
        }

        checkSession();
    </script>
</body>
</html>
